# Canonical nginx config for fansbench.com (production). Enforced on every production
# deploy by release.sh (see ENFORCE_NGINX_CONFIG) — do not hand-edit
# /etc/nginx/sites-available/fansbench.com directly on the server; it will be silently
# overwritten by the next deploy. Change this file and ship it through a normal deploy
# instead, so there's always a single, version-controlled source of truth for it.
#
# PRODUCTION ONLY. This file is not used by staging (fansbench.techdeciphers.co.ke),
# which has its own separate nginx config untouched by this repo's deploy pipeline.

# Port 80: Certbot manages this block. Leave it as is so renewals keep working.
server {
    if ($host = www.fansbench.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = fansbench.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name fansbench.com www.fansbench.com;
    return 404; # managed by Certbot
}

upstream nodejs_fansbench {
    server 127.0.0.1:3010;
}

# Port 443: /api, /sanctum, /admin go to Laravel. Everything else proxies directly to the
# Node frontend — no PHP in the loop for ordinary page views, which is what keeps the site
# fast and means a PHP-FPM hiccup can never take the frontend down with it.
server {
    listen 443 ssl;
    http2 on;
    server_name fansbench.com www.fansbench.com;

    ssl_certificate /etc/letsencrypt/live/fansbench.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fansbench.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/fansbench/current/public;
    client_max_body_size 64M;

    access_log /var/log/nginx/fansbench-access.log;
    error_log /var/log/nginx/fansbench-error.log;

    # Hashed build files never change, so browsers can cache them for a year.
    # A missing file gets a 404 here instead of falling through to Node/Laravel.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # User-uploaded files (category/subcategory/nominee icons, org logos, etc.), served via
    # the public/storage -> storage/app/public symlink that `php artisan storage:link` creates
    # (see release.sh). Without this block, /storage/* doesn't match /api, /sanctum, or /admin,
    # so it falls through to the Node catch-all below — which has no concept of Laravel's
    # storage directory and 404s. UploadController names each file with a random, never-reused
    # string, so — like /assets/ — these are effectively immutable and safe to cache for a year.
    location ^~ /storage/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API / Sanctum / Admin → Laravel backend.
    # try_files falls through to the named @laravel location instead of /index.php directly —
    # nginx resolves a named location's internal redirect correctly, unlike a bare /index.php
    # target, which re-searches ALL top-level locations from scratch and, since /index.php
    # doesn't match any of these regex prefixes, falls through to the Node catch-all below,
    # which would serve the raw .php source as a static file (a real incident this config
    # fixes — see git history for deploy/release.sh around the same date).
    location ~ ^/api {
        try_files $uri $uri/ @laravel;
    }
    location ~ ^/sanctum {
        try_files $uri $uri/ @laravel;
    }
    location ~ ^/admin {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        rewrite ^ /index.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Everything else → React frontend, direct to Node.
    location / {
        proxy_pass http://nodejs_fansbench;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Blocks dotfiles, including the .env probes in the error log.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
