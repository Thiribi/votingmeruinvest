name: linter

on:
  push:
    branches:
      - deploy
      - main
  pull_request:
    branches:
      - deploy
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

